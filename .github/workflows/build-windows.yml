name: Compilar Copiadora de Oficios - Windows x86

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-x86:

    name: Compilar EXE Windows 32 bits

    runs-on: windows-2022

    steps:

      # ============================================================
      # 1. Descargar el código del repositorio
      # ============================================================
      - name: Descargar código del proyecto
        uses: actions/checkout@v4


      # ============================================================
      # 2. Descargar Python 3.7.9 oficial para Windows x86
      # ============================================================
      - name: Descargar Python 3.7.9 x86
        shell: powershell
        run: |
          $pythonUrl = "https://www.python.org/ftp/python/3.7.9/python-3.7.9.exe"
          $pythonInstaller = "$env:RUNNER_TEMP\python-3.7.9-x86.exe"

          Write-Host "Descargando Python 3.7.9 x86 desde Python.org..."
          Invoke-WebRequest `
            -Uri $pythonUrl `
            -OutFile $pythonInstaller

          if (!(Test-Path $pythonInstaller)) {
            Write-Error "No se pudo descargar el instalador de Python 3.7.9."
            exit 1
          }

          Write-Host "Instalador descargado correctamente."


      # ============================================================
      # 3. Instalar Python 3.7.9 x86
      # ============================================================
      - name: Instalar Python 3.7.9 x86
        shell: powershell
        run: |
          $pythonInstaller = "$env:RUNNER_TEMP\python-3.7.9-x86.exe"

          Write-Host "Instalando Python 3.7.9 x86..."

          Start-Process `
            -FilePath $pythonInstaller `
            -ArgumentList "/quiet InstallAllUsers=0 PrependPath=1 Include_pip=1 Include_test=0" `
            -Wait `
            -NoNewWindow

          Write-Host "Instalación finalizada."


      # ============================================================
      # 4. Localizar y seleccionar Python 3.7.9 x86
      # ============================================================
      - name: Configurar Python 3.7.9 x86
        shell: powershell
        run: |
          $pythonPath = "$env:LOCALAPPDATA\Programs\Python\Python37-32"

          if (!(Test-Path "$pythonPath\python.exe")) {
            Write-Error "No se encontró Python 3.7.9 x86 en:"
            Write-Error $pythonPath
            exit 1
          }

          Write-Host "Python encontrado en:"
          Write-Host $pythonPath

          "$pythonPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8

          "$pythonPath\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8


      # ============================================================
      # 5. Verificar versión y arquitectura
      # ============================================================
      - name: Verificar Python 3.7.9 x86
        shell: cmd
        run: |
          python --version

          python -c "import sys, struct; print('Python:', sys.version); print('Arquitectura:', struct.calcsize('P') * 8, 'bits'); assert sys.version_info[:3] == (3,7,9); assert struct.calcsize('P') * 8 == 32"


      # ============================================================
      # 6. Actualizar herramientas de instalación compatibles
      # ============================================================
      - name: Preparar pip compatible con Python 3.7
        shell: cmd
        run: |
          python -m pip install --upgrade "pip<24.1" "setuptools<68" "wheel<0.42"


      # ============================================================
      # 7. Instalar dependencias exactas del proyecto
      # ============================================================
      - name: Instalar dependencias
        shell: cmd
        run: |
          python -m pip install "numpy==1.21.6"
          python -m pip install "opencv-python==4.5.5.64"
          python -m pip install "Pillow==9.5.0"
          python -m pip install "pywin32==306"
          python -m pip install "pyinstaller==5.13.2"


      # ============================================================
      # 8. Verificar versiones y arquitectura de dependencias
      # ============================================================
      - name: Verificar dependencias
        shell: cmd
        run: |
          python -c "import sys, struct; print('Python:', sys.version); print('Arquitectura Python:', struct.calcsize('P') * 8, 'bits')"
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import cv2; print('OpenCV:', cv2.__version__)"
          python -c "import PIL; print('Pillow:', PIL.__version__)"
          python -c "import win32api; print('pywin32: OK')"
          python -m PyInstaller --version


      # ============================================================
      # 9. Comprobar estructura del proyecto
      # ============================================================
      - name: Comprobar archivos del proyecto
        shell: powershell
        run: |
          Write-Host "Contenido del proyecto:"
          Get-ChildItem -Recurse -File | Select-Object FullName

          $requiredFiles = @(
            "main.py",
            "config.json",
            "copiadora.ico",
            "core\scanner.py",
            "core\printer.py",
            "core\image_processor.py",
            "core\config_manager.py",
            "core\network.py",
            "ui\config_window.py"
          )

          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) {
              Write-Error "Falta el archivo requerido: $file"
              exit 1
            }
          }

          Write-Host "Todos los archivos requeridos están presentes."


      # ============================================================
      # 10. Comprobar sintaxis Python antes de empaquetar
      # ============================================================
      - name: Comprobar sintaxis del proyecto
        shell: cmd
        run: |
          python -m py_compile main.py
          python -m py_compile tester.py
          python -m py_compile core\scanner.py
          python -m py_compile core\printer.py
          python -m py_compile core\image_processor.py
          python -m py_compile core\config_manager.py
          python -m py_compile core\network.py
          python -m py_compile ui\config_window.py


      # ============================================================
      # 11. Compilar la aplicación principal
      # ============================================================
      - name: Compilar Copiadora de Oficios
        shell: cmd
        run: |
          python -m PyInstaller ^
            --noconfirm ^
            --clean ^
            --onefile ^
            --windowed ^
            --name "CopiadoraDeOficios" ^
            --icon "copiadora.ico" ^
            --add-data "config.json;." ^
            --paths "." ^
            --hidden-import "win32com.client" ^
            --hidden-import "pythoncom" ^
            --hidden-import "pywintypes" ^
            --hidden-import "win32api" ^
            --hidden-import "win32print" ^
            --hidden-import "win32ui" ^
            --hidden-import "win32con" ^
            --hidden-import "PIL.Image" ^
            --hidden-import "PIL.ImageWin" ^
            main.py


      # ============================================================
      # 12. Verificar que PyInstaller produjo el EXE
      # ============================================================
      - name: Verificar EXE generado
        shell: powershell
        run: |
          $exe = "dist\CopiadoraDeOficios.exe"

          if (!(Test-Path $exe)) {
            Write-Error "PyInstaller no generó el archivo EXE esperado."
            exit 1
          }

          $file = Get-Item $exe

          Write-Host "EXE generado correctamente:"
          Write-Host $file.FullName
          Write-Host "Tamaño:"
          Write-Host $file.Length "bytes"


      # ============================================================
      # 13. Crear paquete de distribución
      # ============================================================
      - name: Preparar paquete final
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null

          Copy-Item `
            "dist\CopiadoraDeOficios.exe" `
            "release\CopiadoraDeOficios.exe"

          Copy-Item `
            "config.json" `
            "release\config.json"

          Write-Host "Contenido del paquete:"
          Get-ChildItem -Recurse "release"


      # ============================================================
      # 14. Subir EXE como Artifact de GitHub
      # ============================================================
      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: CopiadoraDeOficios-Windows-x86
          path: release/
          if-no-files-found: error
          retention-days: 30
