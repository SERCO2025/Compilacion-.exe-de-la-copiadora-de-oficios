name: Compilar Copiadora de Oficios - Windows x86

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/scanner-detection

permissions:
  contents: read

jobs:
  build-windows-x86:
    name: Compilar EXE Windows 32 bits
    runs-on: windows-2022

    steps:

      - name: Descargar código del proyecto
        uses: actions/checkout@v4

      - name: Descargar Python 3.7.9 x86
        shell: powershell
        run: |
          $pythonUrl = "https://www.python.org/ftp/python/3.7.9/python-3.7.9.exe"
          $pythonInstaller = "$env:RUNNER_TEMP\python-3.7.9-x86.exe"
          Invoke-WebRequest -Uri $pythonUrl -OutFile $pythonInstaller

      - name: Instalar Python 3.7.9 x86
        shell: powershell
        run: |
          $pythonInstaller = "$env:RUNNER_TEMP\python-3.7.9-x86.exe"
          Start-Process -FilePath $pythonInstaller -ArgumentList "/quiet InstallAllUsers=0 PrependPath=0 Include_pip=1 Include_test=0" -Wait -NoNewWindow

      - name: Localizar Python 3.7.9 x86
        shell: cmd
        run: |
          set PYTHON_EXE=%LOCALAPPDATA%\Programs\Python\Python37-32\python.exe
          if not exist "%PYTHON_EXE%" set PYTHON_EXE=%ProgramFiles(x86)%\Python37-32\python.exe
          if not exist "%PYTHON_EXE%" set PYTHON_EXE=%ProgramFiles(x86)%\Python37\python.exe
          if not exist "%PYTHON_EXE%" exit 1
          "%PYTHON_EXE%" -c "import sys, struct; print('Python:', sys.version); print('Arquitectura:', struct.calcsize('P') * 8, 'bits'); assert sys.version_info[:3] == (3,7,9); assert struct.calcsize('P') * 8 == 32"

      - name: Preparar pip
        shell: cmd
        run: |
          set PYTHON_EXE=%LOCALAPPDATA%\Programs\Python\Python37-32\python.exe
          "%PYTHON_EXE%" -m ensurepip --upgrade
          "%PYTHON_EXE%" -m pip install --upgrade pip==23.2.1 setuptools==67.8.0 wheel==0.41.0

      - name: Instalar dependencias
        shell: cmd
        run: |
          set PYTHON_EXE=%LOCALAPPDATA%\Programs\Python\Python37-32\python.exe
          "%PYTHON_EXE%" -m pip install numpy==1.21.6 opencv-python==4.5.5.64 Pillow==9.5.0 pywin32==306 pytwain==2.2.2 pyinstaller==5.13.2

      - name: Adaptar pytwain para Python 3.7
        shell: powershell
        run: |
          $python = "$env:LOCALAPPDATA\Programs\Python\Python37-32\python.exe"
          & $python -c "import os,sysconfig; p=os.path.join(sysconfig.get_paths()['purelib'],'twain'); print('pytwain:',p); assert os.path.isdir(p)"
          $twainPath = & $python -c "import os,sysconfig; print(os.path.join(sysconfig.get_paths()['purelib'],'twain'))"
          Get-ChildItem -Path $twainPath -Recurse -Filter *.py | ForEach-Object {
            $content = [System.IO.File]::ReadAllText($_.FullName)
            if ($content -notmatch '(?m)^from __future__ import annotations\s*$') {
              [System.IO.File]::WriteAllText($_.FullName, "from __future__ import annotations`r`n" + $content, [System.Text.UTF8Encoding]::new($false))
            }
          }
          & $python -c "import twain; print('pytwain: OK - compatibilidad Python 3.7 aplicada')"

      - name: Descargar TWAIN DSM 32 bits
        shell: powershell
        run: |
          $url = "https://github.com/twain/twain-dsm/releases/download/v2.5.1/dsm_020501.zip"
          $zip = "$env:RUNNER_TEMP\twain-dsm.zip"
          $extract = "$env:RUNNER_TEMP\twain-dsm"
          Invoke-WebRequest -Uri $url -OutFile $zip
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract -Force

          $dll = Get-ChildItem -Path $extract -Recurse -Filter TWAINDSM.dll |
            Where-Object { $_.FullName -match '\\(32|x86|win32)\\' } |
            Select-Object -First 1

          if ($null -eq $dll) {
            $dll = Get-ChildItem -Path $extract -Recurse -Filter TWAINDSM.dll | Select-Object -First 1
          }

          if ($null -eq $dll) { exit 1 }

          Copy-Item $dll.FullName "TWAINDSM.dll" -Force
          Write-Host "TWAIN DSM seleccionado: $($dll.FullName)"
      - name: Verificar dependencias
        shell: cmd
        run: |
          set PYTHON_EXE=%LOCALAPPDATA%\Programs\Python\Python37-32\python.exe
          "%PYTHON_EXE%" -c "import numpy; print('NumPy:', numpy.__version__)"
          "%PYTHON_EXE%" -c "import cv2; print('OpenCV:', cv2.__version__)"
          "%PYTHON_EXE%" -c "import PIL; print('Pillow:', PIL.__version__)"
          "%PYTHON_EXE%" -c "import win32api; print('pywin32: OK')"
          "%PYTHON_EXE%" -c "import twain; print('pytwain: OK')"
          "%PYTHON_EXE%" -m PyInstaller --version

      - name: Comprobar archivos del proyecto
        shell: powershell
        run: |
          $requiredFiles = @("main.py","config.json","copiadora.ico","TWAINDSM.dll","core\scanner.py","core\printer.py","core\image_processor.py","core\config_manager.py","core\network.py","ui\config_window.py")
          foreach ($file in $requiredFiles) {
            if (!(Test-Path $file)) { exit 1 }
          }

      - name: Comprobar sintaxis del proyecto
        shell: cmd
        run: |
          set PYTHON_EXE=%LOCALAPPDATA%\Programs\Python\Python37-32\python.exe
          "%PYTHON_EXE%" -m py_compile main.py tester.py core\scanner.py core\printer.py core\image_processor.py core\config_manager.py core\network.py ui\config_window.py

      - name: Compilar Copiadora de Oficios
        shell: cmd
        run: |
          set PYTHON_EXE=%LOCALAPPDATA%\Programs\Python\Python37-32\python.exe
          "%PYTHON_EXE%" -m PyInstaller --noconfirm --clean --onefile --windowed --name CopiadoraDeOficios --icon copiadora.ico --add-data "config.json;." --add-binary "TWAINDSM.dll;." --paths . --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes --hidden-import win32api --hidden-import win32print --hidden-import win32ui --hidden-import win32con --hidden-import PIL.Image --hidden-import PIL.ImageWin --hidden-import twain main.py

      - name: Verificar EXE generado
        shell: powershell
        run: |
          $exe = "dist\CopiadoraDeOficios.exe"
          if (!(Test-Path $exe)) { exit 1 }

      - name: Preparar paquete final
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          Copy-Item "dist\CopiadoraDeOficios.exe" "release\CopiadoraDeOficios.exe"
          Copy-Item "config.json" "release\config.json"

      - name: Publicar EXE
        uses: actions/upload-artifact@v4
        with:
          name: CopiadoraDeOficios-Windows-x86
          path: release/
          if-no-files-found: error
          retention-days: 30
